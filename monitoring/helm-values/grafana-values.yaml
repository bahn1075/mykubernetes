# Grafana values for OCI deployment
nameOverride: "grafana"
fullnameOverride: "grafana"

# 이미지 설정
image:
  repository: grafana/grafana
  tag: latest
  pullPolicy: IfNotPresent

# 복제본 설정
replicas: 1

# Pod Security Context
podSecurityContext:
  fsGroup: 472
  runAsNonRoot: true
  runAsUser: 472

# 리소스 제한
resources:
  requests:
    cpu: 20m
    memory: 128Mi

# 서비스 설정
service:
  type: ClusterIP
  port: 80
  targetPort: 3000

# Ingress 설정
ingress:
  enabled: true
  ingressClassName: nginx
  hosts:
    - host: grafana.64bit.kr
      paths:
        - path: /
          pathType: Prefix
  tls: []

# 환경 변수 설정
env:
  GF_INSTALL_PLUGINS: "grafana-piechart-panel,grafana-worldmap-panel"
  GF_PATHS_DATA: "/var/lib/grafana"
  GF_PATHS_LOGS: "/var/log/grafana"
  GF_PATHS_PLUGINS: "/var/lib/grafana/plugins"
  GF_PATHS_PROVISIONING: "/etc/grafana/provisioning"

# Admin 사용자 시크릿 (기존 시크릿 사용)
admin:
  existingSecret: grafana-admin
  userKey: admin-user
  passwordKey: admin-password

# Grafana 설정 (grafana.ini)
grafana.ini:
  server:
    root_url: http://grafana.64bit.kr

# 데이터소스 프로비저닝
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://prometheus-prometheus.monitoring.svc.cluster.local:9090
        access: proxy
        isDefault: true
      - name: Loki
        type: loki
        url: http://loki.monitoring.svc.cluster.local:3100
        access: proxy
      - name: Tempo
        type: tempo
        url: http://tempo.monitoring.svc.cluster.local:3200
        access: proxy

# 대시보드 프로비저닝
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default

# 영구 스토리지 설정 (OCI FSS)
persistence:
  enabled: true
  storageClassName: ""
  accessModes:
    - ReadWriteMany
  size: 10Gi
  # OCI FSS CSI 드라이버 사용
  volumeName: grafana-unified-fss-pv
  # PV 설정 (별도 생성 필요)
  persistentVolume:
    enabled: true
    volumeHandle: "ocid1.export.oc1.ap_chuncheon_1.aaaaaa4np2weim52pfxhsllqojxwiotboawwg2dvnzrwqzlpnywtcllbmqwtcaaa:10.0.10.194:/oke_fss/grafana"
    mountOptions:
      - nosuid
    csi:
      driver: fss.csi.oraclecloud.com

# Liveness Probe 설정
livenessProbe:
  httpGet:
    path: /api/health
    port: 3000
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 30
  failureThreshold: 10

# Readiness Probe 설정
readinessProbe:
  httpGet:
    path: /api/health
    port: 3000
  initialDelaySeconds: 30
  periodSeconds: 10

# 레이블 설정
labels:
  app: grafana
  environment: oci
