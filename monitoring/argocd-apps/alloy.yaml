apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
spec:
  project: default
  source:
    chart: alloy
    repoURL: https://grafana.github.io/helm-charts
    targetRevision: 0.13.0
    helm:
      releaseName: alloy
      values: |
        # Grafana Alloy (로그 수집)
        alloy:
          configMap:
            content: |
              logging {
                level  = "info"
                format = "logfmt"
              }

              // Kubernetes Pod 탐색
              discovery.kubernetes "pods" {
                role = "pod"
              }

              // Kubernetes Pod 로그 수집
              loki.source.kubernetes "pods" {
                targets    = discovery.kubernetes.pods.targets
                forward_to = [loki.write.default.receiver]
              }

              // Loki로 전송
              loki.write "default" {
                endpoint {
                  url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
                }
              }

        controller:
          type: "daemonset"

        alloy-logs:
          enabled: true

        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 20m
            memory: 64Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
