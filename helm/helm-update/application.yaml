apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: helm-update
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/cozy-oci/cronjob.git
    targetRevision: main
    path: helm-update/k8s
    directory:
      exclude: "secret*.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: cronjob
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
