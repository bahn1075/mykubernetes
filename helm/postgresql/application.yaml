apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgresql
  namespace: argocd
spec:
  project: default
  sources:
    # Helm 차트 소스 (Bitnami repo에서 직접)
    - repoURL: https://charts.bitnami.com/bitnami
      chart: postgresql
      targetRevision: 16.4.1
      helm:
        valueFiles:
          - $values/helm/postgresql/values.yaml
    # Values 파일 소스 (Git repo)
    - repoURL: https://github.com/bahn1075/mykubernetes.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: postgres
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
