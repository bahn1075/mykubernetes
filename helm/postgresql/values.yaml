#############################################################################
####  Bitnami PostgreSQL Helm Chart - Custom Values
####  Chart: https://charts.bitnami.com/bitnami/postgresql
####  ArgoCD로 배포됨
#############################################################################

# 글로벌 설정
global:
  postgresql:
    auth:
      postgresPassword: postgres123
      username: postgres
      password: postgres123
      database: postgresdb

# 이미지 설정
image:
  registry: docker.io
  repository: bitnami/postgresql
  tag: latest
  pullPolicy: IfNotPresent

# Primary PostgreSQL 설정
primary:
  # 리소스 설정 (기존 값 유지)
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

  # Pod Annotations
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9187"
    prometheus.io/path: "/metrics"

  # Security Context - FSS 스토리지 권한 문제로 root 실행
  containerSecurityContext:
    enabled: true
    runAsUser: 0
    runAsNonRoot: false
    readOnlyRootFilesystem: false

  podSecurityContext:
    enabled: true
    fsGroup: 0

  # Persistence 설정 - 기존 PVC 사용
  persistence:
    enabled: true
    existingClaim: postgres-postgresql-data-0
    subPath: postgresql
    size: 10Gi

  # Liveness/Readiness Probe
  livenessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6

  readinessProbe:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6

# 서비스 설정
service:
  type: ClusterIP
  ports:
    postgresql: 5432

# Metrics (Prometheus Exporter)
metrics:
  enabled: false
  # 필요시 true로 변경

# Replica 비활성화 (단일 노드)
architecture: standalone

# Volume Permissions Init Container
volumePermissions:
  enabled: false
