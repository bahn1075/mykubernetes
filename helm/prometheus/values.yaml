#############################################################################
 ####  helm uninstall prometheus -n monitoring 
 ####  helm upgrade --install prometheus prometheus-community/kube-prometheus-stack \
 ####  --namespace monitoring --values /app/kubernetes/monitoring/helm-values/prometheus-values.yaml
#############################################################################
# Prometheus values
nameOverride: "prometheus"
fullnameOverride: "prometheus"

prometheus:
  service:
    # Prometheus 서비스 이름을 명시적으로 지정
    type: ClusterIP
  # 외부 노출은 Tailscale Ingress만 사용한다. 차트 기본값 변경으로 LoadBalancer
  # Service가 생성되어 Kyverno 정책을 위반하지 않도록 모든 Prometheus Service를 고정한다.
  servicePerReplica:
    enabled: false
    type: ClusterIP
  thanosService:
    enabled: false
    type: ClusterIP
  prometheusSpec:
    # OCI FSS(RWX/NFS)는 POSIX 파일 잠금을 지원하지 않는다. Prometheus 3.14+의
    # TSDB lock DB 생성을 비활성화해 재시작 시 CrashLoopBackOff가 발생하지 않게 한다.
    # replicas는 1로 유지해야 한다.
    additionalArgs:
      - name: storage.tsdb.no-lockfile
    retention: 5d
    priorityClassName: monitoring-critical
    resources:
      requests:
        cpu: 200m
        memory: 1Gi
      limits:
        cpu: 1000m
        memory: 1Gi

    # Pod Anti-Affinity 설정
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                    - loki
            topologyKey: kubernetes.io/hostname

    # PVC를 사용하도록 설정 (emptyDir 대신)
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: ""  # 정적 프로비저닝
          accessModes:
            - ReadWriteMany
          resources:
            requests:
              storage: 5Gi
          volumeName: prometheus-fss-pv  # 생성한 PV 이름
    # 컨테이너에 subPath 추가
    containers:
      - name: prometheus
        volumeMounts:
          - name: prometheus-prometheus-prometheus-db
            mountPath: /prometheus
            subPath: prometheus  # /oke-fss/prometheus 사용
      - name: config-reloader
        resources:
          requests:
            cpu: 50m
            memory: 50Mi
          limits:
            cpu: 50m
            memory: 50Mi

    additionalScrapeConfigs:
      # NOTE: kafka(my-cluster-kafka*)·tempo 스크랩 잡은 해당 워크로드가 클러스터에 배포돼 있지
      # 않아 up==0 → TargetDown 만성 오탐이었다. 미배포 타깃 제거(배포 시 다시 추가).
      # Loki에서 메트릭 수집 (loki.monitoring 서비스는 실제 존재)
      - job_name: 'loki'
        static_configs:
          - targets: ['loki.monitoring.svc.cluster.local:3100']

# 매니지드 컨트롤플레인(OKE): kube-scheduler/controller-manager 메트릭 엔드포인트는 스크랩 불가 →
# up==0 으로 KubeSchedulerDown / KubeControllerManagerDown 이 만성 오탐. 해당 컴포넌트의
# ServiceMonitor와 Down 알림 룰을 함께 비활성화한다(스케줄링 자체는 정상 동작).
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false

# AlertManager 설정
alertmanager:
  alertmanagerSpec:
    # 리소스 제한 추가
    resources:
      requests:
        cpu: 10m
        memory: 64Mi

# Grafana는 별도 설치하므로 비활성화
grafana:
  enabled: false

# Prometheus Operator 설정
prometheusOperator:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
  prometheusConfigReloader:
    resources:
      requests:
        cpu: 50m
        memory: 50Mi
      limits:
        cpu: 50m
        memory: 50Mi

# Node Exporter 활성화
nodeExporter:
  enabled: true

prometheus-node-exporter:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                  - 10.0.10.39
                  - 10.0.10.143
  containerSecurityContext:
    privileged: true
    readOnlyRootFilesystem: true
  livenessProbe:
    timeoutSeconds: 5
    failureThreshold: 5
  readinessProbe:
    timeoutSeconds: 5

# kube-state-metrics 활성화
kubeStateMetrics:
  enabled: true

# 서비스 모니터 활성화
serviceMonitor:
  enabled: true
