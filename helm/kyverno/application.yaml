apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  sources:
    # Helm 차트 소스 (kyverno repo에서 직접)
    - repoURL: https://kyverno.github.io/kyverno/
      chart: kyverno
      targetRevision: 3.7.1
      helm:
        valueFiles:
          - $values/helm/kyverno/values.yaml
    # Values 파일 소스 (Git repo)
    - repoURL: https://github.com/bahn1075/mykubernetes.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  ignoreDifferences:
    # CRD status/conversion 필드는 클러스터가 자동 추가하므로 무시
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /status
        - /spec/conversion
    # 완료된 migration Job(helm hook)은 무시
    - group: batch
      kind: Job
      name: kyverno-migrate-resources
      jsonPointers:
        - /status
        - /spec
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
  revisionHistoryLimit: 3
