apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: langflow-inotify-sysctl
  namespace: kube-system
  labels:
    app.kubernetes.io/name: langflow-inotify-sysctl
    app.kubernetes.io/part-of: langflow
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: langflow-inotify-sysctl
  template:
    metadata:
      labels:
        app.kubernetes.io/name: langflow-inotify-sysctl
        app.kubernetes.io/part-of: langflow
    spec:
      hostPID: true
      tolerations:
        - operator: Exists
      containers:
        - name: sysctl
          image: docker.io/library/busybox:1.36
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
            runAsUser: 0
          command:
            - /bin/sh
            - -c
            - |
              set -eu

              apply_sysctls() {
                echo 524288 > /host-proc/sys/fs/inotify/max_user_watches
                echo 1024 > /host-proc/sys/fs/inotify/max_user_instances
                echo 16384 > /host-proc/sys/fs/inotify/max_queued_events
              }

              apply_sysctls
              while true; do
                sleep 3600
                apply_sysctls
              done
          volumeMounts:
            - name: host-proc-sys
              mountPath: /host-proc/sys
      volumes:
        - name: host-proc-sys
          hostPath:
            path: /proc/sys
            type: Directory
