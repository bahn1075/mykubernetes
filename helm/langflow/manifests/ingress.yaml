apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: langflow-tailscale
  namespace: langflow
spec:
  ingressClassName: tailscale
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: langflow-service-backend
                port:
                  number: 7860
  tls:
    - hosts:
        - langflow
