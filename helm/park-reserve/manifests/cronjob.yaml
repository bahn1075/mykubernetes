apiVersion: batch/v1
kind: CronJob
metadata:
  name: park-reserve
spec:
  schedule: "0 0 * * 2,4"
  timeZone: "Asia/Seoul"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: park-reserve
          containers:
            - name: park-reserve
              image: docker.io/bahn1075/park-reserve:2608030901
              imagePullPolicy: IfNotPresent
              securityContext:
                runAsUser: 0
              envFrom:
                - secretRef:
                    name: park-reserve-secret
              volumeMounts:
                - name: ssh
                  mountPath: /root/.ssh
                  readOnly: true
          volumes:
            - name: ssh
              secret:
                secretName: park-reserve-ssh
                defaultMode: 0400
