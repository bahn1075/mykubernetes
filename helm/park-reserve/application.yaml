apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: park-reserve
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/bahn1075/mykubernetes.git
    targetRevision: main
    path: helm/park-reserve/manifests
    directory:
      exclude: "secret*.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: cronjob
  ignoreDifferences:
    - group: ""
      kind: Service
      name: mac
      namespace: cronjob
      jsonPointers:
        - /spec/externalName
        - /spec/clusterIP
        - /spec/clusterIPs
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  revisionHistoryLimit: 3
