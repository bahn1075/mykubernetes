apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: phoenix
  namespace: argocd
spec:
  project: default
  sources:
    # Helm 차트 소스 (OCI registry에서 직접)
    - repoURL: registry-1.docker.io/arizephoenix
      chart: phoenix-helm
      targetRevision: 5.0.7
      helm:
        valueFiles:
          - $values/helm/phoenix/values.yaml
    # Values 파일 소스 (Git repo)
    - repoURL: https://github.com/bahn1075/mykubernetes.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: phoenix
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: phoenix-secret
      jsonPointers:
        - /data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
