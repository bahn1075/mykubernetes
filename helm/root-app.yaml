apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/bahn1075/mykubernetes.git
      targetRevision: main
      path: helm
      directory:
        recurse: true
        include: '{*/application.yaml}'
        exclude: 'kong/*'
    - repoURL: https://github.com/cozy-oci/langflow.git
      targetRevision: main
      path: .
      directory:
        include: 'application.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
